# libero_spatial_eval_dreamzero_hetero.yaml
# Heterogeneous DreamZero eval (embodied):
#   - env worker   (LIBERO / mujoco rendering)  -> a consumer-GPU node group
#   - rollout worker (DreamZero / WAN inference) -> an Ascend NPU node group
#
# Identical to libero_spatial_eval_dreamzero.yaml EXCEPT the `cluster` block
# below. eval launches only env + rollout workers (no actor), so only those two
# components need placement. env<->rollout exchange is CPU-staged (gloo); RLinf
# auto-disables accel CCL when the two sides have different accelerator models,
# so a CUDA-node <-> NPU-node link works without NCCL/HCCL.
#
# Launch (the non-default --base-config makes run_dreamzero_eval.py skip its
# single-node visible-device pinning, leaving device selection to node_groups):
#   run_dreamzero_eval.py --base-config libero_spatial_eval_dreamzero_hetero \
#       --suite libero_130 --per-task-num 1 --num-gpus 1 ...
# --num-gpus must equal the env group's world size (number of render GPUs), so
# that total_num_envs % num_gpus == 0.
#
# Cluster bring-up: start Ray on both nodes, setting RLINF_NODE_RANK to match the
# node_ranks below (render GPU node -> 0, NPU node -> 1) BEFORE `ray start`.

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/dreamzero_5b@rollout.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Detailed (per-component) placement: each component on its own node group.
  # `placement` lists hardware ranks WITHIN that group (0 = one device; widen to
  # 0-N for more). actor is intentionally omitted: eval never launches it.
  component_placement:
    env,rollout: 0-1
runner:
  task_type: embodied_eval
  logger:
    log_path: "./results"
    project_name: rlinf
    experiment_name: "libero_spatial_eval_dreamzero"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: /path/to/model.pt

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 5
  adv_type: grpo
  loss_type: actor_critic

  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480

  eval:
    # LIBERO-Spatial: 10 tasks x 50 trials = 500 init states. With total_num_envs parallel envs,
    # set max_steps_per_rollout_epoch to ceil(500/total_num_envs) * max_episode_steps so auto_reset
    # cycles through the full suite within one eval_rollout_epoch (see vla-eval.rst).
    total_num_envs: 40
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 1920  # 4 * max_episode_steps -> ~512 trajectories
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "dreamzero"
    precision: bf16
    model_path: null
    tokenizer_path: /data/models/Wan2.2-TI2V-5B/google/umt5-xxl
    diffusion_model_pretrained_path: /data/models/Wan2.2-TI2V-5B
    image_encoder_pretrained_path: /data/models/Wan2.2-TI2V-5B/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
    text_encoder_pretrained_path: /data/models/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    vae_pretrained_path: /data/models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    # metadata_json_path: /home/gan/models/Wan2.2-TI2V-5B/experiment_cfg/metadata.json
    metadata_json_path: /data/models/RLinf-DreamZero-WAN2.2-5B-LIBERO-SFT-Step26000/experiment_cfg/metadata.json

    embodiment_tag: "libero_sim"

    is_lora: False
    action_horizon: 16
    num_action_chunks: 16
    num_action_per_block: 16
    target_video_height: 160
    target_video_width: 320


  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${rollout.model.precision}
      reduce_dtype: ${rollout.model.precision}
      buffer_dtype: ${rollout.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
